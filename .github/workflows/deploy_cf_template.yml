# pre requisites- we need to have a s3 bucket provisioned in 'us-east-1' where all templates are uploaded.
# we assume that its already created and the name is 'cloudformationtemplatessreejit'
# make sure the yml file name follows the stack naming rules


# https://github.com/aws-actions/aws-cloudformation-github-deploy
# https://github.com/actions/checkout#checkout-v4
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/pass-job-outputs
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/run-job-variations
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/run-job-variations


name : deploy-clousformation

on:
    push:
        branches:
            - main

permissions:
    id-token: write
    contents: read
jobs:

    build:
        runs-on: ubuntu-latest
        outputs:
            file_array: ${{ steps.Copy-files-to-s3.outputs.file_list }}

        steps:

            - id: checkout-code
              uses: actions/checkout@v4
        
            - id: authenticate-aws-creds
              uses: aws-actions/configure-aws-credentials@v3
              with:
                role-to-assume: arn:aws:iam::468094684048:role/deploymentRole
                aws-region: "us-east-1"
                role-session-name: SreejitsSession
            
            - id: Verify
              run: aws sts get-caller-identity

            - id: Copy-files-to-s3
              run: |
                    file_array=()
                    echo "${{ github.workspace }}"
                    cd src/cloudformation/deployment
                    for file in *;do
                    if [ -f $file ]; then

                    # convert s3.yml to s3yml to satisfy naming of stacks
                    clean_name="${file//./}"

                    echo "Processing: $file"
                    aws s3 cp $file s3://cloudformationtemplatessreejit/$clean_name

                    file_array+=("$clean_name")
                    fi
                    done
                    
                    # now file_array looks like  :-     stack1.yaml stack2.yaml
                    # we convert to ["stack1.yaml","stack2.yaml"]

                    JSON_ARRAY=$(printf '"%s",' "${file_array[@]}")
                    JSON_ARRAY="[${JSON_ARRAY%,}]"
                    echo "file_list=$JSON_ARRAY" >> "$GITHUB_OUTPUT"
    
    deploy:
        runs-on: ubuntu-latest
        needs: build
        strategy:
            matrix:
                file: ${{ fromJSON(needs.build.outputs.file_array) }}

        steps:

            - id: authenticate-aws-creds
              uses: aws-actions/configure-aws-credentials@v3
              with:
                role-to-assume: arn:aws:iam::468094684048:role/deploymentRole
                aws-region: "us-east-1"
                role-session-name: SreejitsSession
            
            - id: Verify
              run: aws sts get-caller-identity


            - name: Deploy CloudFormation Stack
              uses: aws-actions/aws-cloudformation-github-deploy@v2.0.0
              with:
                name: ${{ matrix.file }}
                template: https://cloudformationtemplatessreejit.s3.ap-south-1.amazonaws.com/${{ matrix.file }}
                fail-on-empty-changeset: false

                



